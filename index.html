<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نرسم مع بعض حبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdfcfa;
    --paper: #ffffff;
    --ink: #2b2622;
    --muted: #8c8378;
    --line: #ece7df;
    --accent: #d97a63;
    --accent-soft: #f3ded7;
    --shadow: 0 2px 14px rgba(60,50,40,0.06);
    --shadow-lg: 0 12px 40px rgba(60,50,40,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:'Cairo', sans-serif;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  #app{position:fixed; inset:0;}

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:var(--bg); z-index:9999;
  }
  #loading .mark{font-family:'Caveat',cursive; font-size:34px; color:var(--accent);}
  .spinner{width:22px; height:22px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Library ---------- */
  #library{position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:none;}
  #library.active{display:block;}
  .lib-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 32px 8px; max-width:920px; margin:0 auto;
  }
  .lib-title{font-family:'Caveat',cursive; font-size:30px; color:var(--accent); letter-spacing:0.3px;}
  .lib-sub{font-size:12.5px; color:var(--muted); margin-top:-2px;}
  .lib-empty{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  }
  .create-btn{
    display:flex; align-items:center; gap:10px; padding:16px 28px;
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    box-shadow:var(--shadow); cursor:pointer; font-family:'Cairo'; font-size:15.5px; color:var(--ink);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .create-btn:active{transform:scale(0.97);}
  .create-btn:hover{box-shadow:var(--shadow-lg);}
  .create-btn .plus{font-size:19px; color:var(--accent);}
  .lib-grid{
    max-width:920px; margin:18px auto 60px; padding:0 32px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px;
  }
  .paper-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .paper-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .paper-card:active{transform:scale(0.98);}
  .paper-card{position:relative;}
  .paper-delete{position:absolute;top:10px;left:10px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#b54b4b;box-shadow:0 2px 8px rgba(60,50,40,.12);cursor:pointer;font-size:16px;z-index:2;}
  .paper-delete:hover{background:#fff0f0;color:#d12e43;}
  .paper-thumb{
    width:100%; aspect-ratio:4/3; background:#fbfaf7 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="1" cy="1" r="0.6" fill="%23e9e3d9"/></svg>');
    display:flex; align-items:center; justify-content:center;
  }
  .paper-thumb img{width:100%; height:100%; object-fit:cover;}
  .paper-thumb .ph{color:var(--muted); font-size:24px; opacity:0.4;}
  .paper-meta{padding:12px 14px 14px;}
  .paper-name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .paper-time{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .create-tile{
    border:1.5px dashed var(--line); border-radius:var(--radius); aspect-ratio:4/3;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
    background:transparent; transition:border-color .18s, color .18s;
  }
  .create-tile:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- Prank Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(40,32,26,0.32); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--paper); border-radius:22px; max-width:380px; width:100%;
    padding:30px 26px; box-shadow:var(--shadow-lg); text-align:center;
    animation:pop .28s cubic-bezier(.2,1,.3,1);
  }
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal h2{font-size:19px; margin:0 0 4px;}
  .modal .price{font-family:'Caveat',cursive; font-size:44px; color:var(--accent); margin:14px 0 2px;}
  .modal .price-sub{font-size:12px; color:var(--muted); margin-bottom:16px;}
  .modal ul{list-style:none; padding:0; margin:0 0 22px; text-align:right; font-size:13.5px; line-height:2.1; color:#5c554d;}
  .modal ul li:before{content:"✦ "; color:var(--accent);}
  .modal button{
    display:block; width:100%; padding:14px; border:none; border-radius:14px;
    font-family:'Cairo'; font-size:14.5px; cursor:pointer; margin-bottom:10px; transition:transform .15s;
  }
  .modal button:active{transform:scale(0.97);}
  .btn-sub{background:var(--ink); color:#fff;}
  .btn-free{background:var(--accent-soft); color:var(--accent);}
  .btn-sub.prank-shake{background:#d92f45;color:#fff;animation:prankShake .42s ease-in-out 0s 2;}
  @keyframes prankShake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px) rotate(-1deg)}80%{transform:translateX(5px) rotate(1deg)}}
  .prank-msg{font-size:17px; line-height:1.9; font-weight:600; color:var(--ink);}

  /* ---------- Canvas view ---------- */
  #canvasView{position:fixed; inset:0; display:none; background:#f7f5f1;}
  #canvasView.active{display:block;}
  #drawCanvas, #liveCanvas{position:absolute; inset:0; touch-action:none;}
  #liveCanvas{pointer-events:none;}

  .topbar{
    position:absolute; top:14px; left:16px; right:16px; z-index:20;
    display:flex; align-items:center; justify-content:space-between; pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .pill{
    background:rgba(255,255,255,0.88); backdrop-filter:blur(8px); border:1px solid var(--line);
    border-radius:999px; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px;
    padding:8px 14px; font-size:13px;
  }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,0.88);
    backdrop-filter:blur(8px); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; color:var(--ink); border:1px solid var(--line); transition:transform .15s;
  }
  .icon-btn:active{transform:scale(0.92);}
  .paper-name-tag{font-weight:600; font-size:13.5px;}
  .presence-dots{display:flex; gap:-4px;}
  .presence-dot{
    width:20px; height:20px; border-radius:50%; border:2px solid #fff; margin-inline-start:-6px;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff; font-weight:700;
  }

  .page-name-modal{position:fixed;inset:0;background:rgba(40,32,26,.32);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:4500;padding:20px;}
  .page-name-modal.active{display:flex;}
  .page-name-box{background:#fff;border-radius:22px;padding:24px;width:min(360px,100%);box-shadow:var(--shadow-lg);text-align:right;}
  .page-name-box h3{margin:0 0 8px;font-size:18px;}
  .page-name-box p{margin:0 0 16px;color:var(--muted);font-size:12px;}
  .page-name-box input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-family:Cairo;font-size:14px;}
  .page-name-actions{display:flex;gap:8px;margin-top:14px;}
  .page-name-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-family:Cairo;cursor:pointer;}
  .page-name-actions .ok{background:var(--ink);color:#fff;}
  .page-name-actions .cancel{background:var(--accent-soft);color:var(--accent);}
  .tool-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
  .toolbar{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:20;
    background:rgba(255,255,255,0.96); backdrop-filter:blur(18px); border:1px solid rgba(236,231,223,.9);
    border-radius:18px; box-shadow:0 14px 42px rgba(35,29,24,.18),0 2px 8px rgba(35,29,24,.08); padding:9px 10px;
    display:flex; align-items:center; gap:6px; max-width:calc(100vw - 24px); overflow-x:auto;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .tb-btn{
    width:42px; height:42px; border-radius:12px; border:none; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink); flex:none;
    transition:background .15s, transform .15s, color .15s; position:relative;
  }
  .tb-btn:hover{background:#f7f2ed;color:var(--accent);}
  .tb-btn:active{transform:scale(0.9);}
  .tb-btn.active{background:var(--accent-soft); color:var(--accent);}
  .tb-btn.tool-active{background:var(--ink);color:#fff;box-shadow:0 3px 8px rgba(43,38,34,.18);}
  .tb-sep{width:1px; height:24px; background:var(--line); flex:none; margin:0 2px;}
  .swatch{
    width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--line); flex:none; cursor:pointer;
  }

  .panel{
    position:absolute; bottom:74px; left:50%; transform:translateX(-50%); z-index:25;
    background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); border:1px solid var(--line);
    border-radius:20px; box-shadow:var(--shadow-lg); padding:16px; width:min(320px,calc(100vw - 24px));
    display:none;
  }
  .panel.active{display:block;}
  .panel-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .panel-row label{font-size:12.5px; color:var(--muted);}
  .panel input[type=range]{width:170px; accent-color:var(--accent);}
  .brush-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .brush-opt{
    border:1px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center; cursor:pointer;
    font-size:10.5px; color:var(--ink); background:#fff; transition:all .15s;
  }
  .brush-opt.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .brush-opt .bi{font-size:16px; display:block; margin-bottom:3px;}
  .color-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .color-dot{width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .color-dot.active{box-shadow:0 0 0 2px var(--accent);}
  .hex-row{display:flex; gap:8px; align-items:center;}
  .hex-row input[type=text]{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-size:12.5px; font-family:monospace;
  }
  .hex-row input[type=color]{width:32px; height:32px; border:none; background:none; padding:0; cursor:pointer;}

  .zoom-indicator{
    position:absolute; top:64px; right:16px; z-index:20; font-size:11px; color:var(--muted);
    background:rgba(255,255,255,0.88); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  }

  .cursor-badge{
    position:absolute; pointer-events:none; z-index:15; transform:translate(-4px,-4px);
    display:flex; flex-direction:column; align-items:flex-start; transition:left .06s linear, top .06s linear;
  }
  .cursor-badge .dot{width:12px; height:12px; border-radius:50% 50% 50% 0; transform:rotate(45deg); box-shadow:0 1px 4px rgba(0,0,0,0.3);}
  .cursor-badge .tag{
    font-size:10px; color:#fff; padding:2px 7px; border-radius:8px; margin-top:2px; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }

  /* لا توجد رسائل عائمة مزعجة أسفل الشاشة؛ الحالة تظهر داخل الأدوات فقط. */
  .toast,.toast.show{display:none!important;}

  .name-prompt{
    position:fixed; inset:0; background:var(--bg); z-index:5000; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .name-card{max-width:340px; width:100%; text-align:center;}
  .name-card .mark{font-family:'Caveat',cursive; font-size:36px; color:var(--accent); margin-bottom:6px; display:block;}
  .name-card p{font-size:13px; color:var(--muted); margin-bottom:20px;}
  .name-card input{
    width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--line); font-family:'Cairo';
    font-size:14.5px; text-align:center; margin-bottom:12px; background:var(--paper);
  }
  .name-card button{
    width:100%; padding:14px; border:none; border-radius:14px; background:var(--ink); color:#fff;
    font-family:'Cairo'; font-size:14.5px; cursor:pointer;
  }
  .auth-fields{display:grid;gap:9px;margin-bottom:12px;}
  .auth-fields input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-family:Cairo;font-size:13px;text-align:right;background:var(--paper);}
  .password-wrap{position:relative;}
  .password-wrap input{padding-left:44px;}
  .password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;padding:4px;}
  .password-toggle:hover{color:var(--accent);}
  .auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .auth-actions button{font-size:13px;padding:12px;}
  .auth-actions .secondary{background:var(--accent-soft);color:var(--accent);}
  .auth-note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:10px;}
  .offline-badge{
    position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:30;
    background:#3a3128; color:#fff; font-size:11.5px; padding:6px 14px; border-radius:999px; display:none;
  }
  .offline-badge.show{display:block;}
</style>
</head>
<body>
<div id="app">

  <div id="loading">
    <span class="mark">نرسم مع بعض حبي</span>
    <div class="spinner"></div>
  </div>

  <div id="namePrompt" class="name-prompt" style="display:none;">
    <div class="name-card">
      <span class="mark">أهلاً 👋</span>
      <p>وش نسميك في الرسمة؟</p>
      <input id="nameInput" type="text" maxlength="18" placeholder="اسمك">
      <div class="auth-fields">
        <input id="emailInput" type="email" autocomplete="email" placeholder="الإيميل">
        <div class="password-wrap"><input id="passwordInput" type="password" autocomplete="new-password" placeholder="كلمة المرور (6 أحرف على الأقل)"><button type="button" class="password-toggle" id="passwordToggle" aria-label="إظهار كلمة المرور">◉</button></div>
      </div>
      <div class="auth-actions">
        <button id="nameSubmit">دخول</button>
        <button id="registerSubmit" class="secondary">إنشاء حساب</button>
      </div>
      <div class="auth-note">حسابك الثابت يحفظ اسمك وصفحاتك على كل جهاز.</div>
    </div>
  </div>

  <div id="library">
    <div class="lib-header">
      <div>
        <div class="lib-title">نرسم مع بعض حبي</div>
        <div class="lib-sub" id="libSub"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        <button class="create-btn" id="renameBtn">تغيير الاسم</button>
        <button class="create-btn" id="prankBtn">Premium</button>
        <button class="create-btn" id="createBtnTop"><span class="plus">＋</span> ورقة جديدة</button>
      </div>
    </div>
    <div class="lib-grid" id="libGrid"></div>
  </div>

  <div class="lib-empty" id="libEmpty" style="display:none;">
    <button class="create-btn" id="createBtnEmpty"><span class="plus">＋</span> ورقة جديدة</button>
  </div>

  <div id="canvasView">
    <canvas id="drawCanvas"></canvas>
    <canvas id="liveCanvas"></canvas>
    <div id="cursorLayer"></div>

    <div class="offline-badge" id="offlineBadge">أنت غير متصل — الرسم يتخزن عندك ❤️</div>

    <div class="topbar">
      <button class="icon-btn" id="exitBtn" title="Exit">→</button>
      <div class="pill">
        <span class="paper-name-tag" id="paperNameTag">Paper</span>
        <div class="presence-dots" id="presenceDots"></div>
      </div>
      <button class="icon-btn" id="downloadBtn" title="Download PNG">⬇</button>
    </div>

    <div class="zoom-indicator" id="zoomIndicator">100%</div>

    <div class="panel" id="brushPanel">
      <div class="brush-grid" id="brushGrid"></div>
    </div>
    <div class="panel" id="colorPanel">
      <div class="color-grid" id="colorGrid"></div>
      <div class="hex-row">
        <input type="color" id="colorNative" value="#2b2622">
        <input type="text" id="hexInput" placeholder="#2B2622">
      </div>
    </div>
    <div class="panel" id="sizePanel">
      <div class="panel-row"><label>الحجم</label><input type="range" id="sizeRange" min="1" max="80" value="6"></div>
      <div class="panel-row"><label>الشفافية</label><input type="range" id="opacityRange" min="5" max="100" value="100"></div><div class="panel-row"><label>تثبيت الخط</label><input type="range" id="stabilizeRange" min="0" max="100" value="45"></div>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="tb-btn tool-active" id="brushToggle" title="مكتبة الفرش">🖌</button>
      <button class="tb-btn" id="eraserQuick" title="ممحاة فورية">⌫</button>
      <button class="tb-btn" id="colorToggle" title="اللون"><span id="colorPreview" style="width:16px;height:16px;border-radius:50%;background:#2b2622;display:block;"></span></button>
      <button class="tb-btn" id="sizeToggle" title="الحجم والشفافية">◐</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="undoBtn" title="تراجع (Ctrl+Z)">↺</button>
      <button class="tb-btn" id="redoBtn" title="إعادة (Ctrl+Shift+Z)">↻</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="zoomOutBtn" title="Zoom out">−</button>
      <button class="tb-btn" id="zoomResetBtn" title="Reset zoom">⊙</button>
      <button class="tb-btn" id="zoomInBtn" title="Zoom in">＋</button>
    </div>
  </div>

  <div id="pageNameModal" class="page-name-modal">
    <div class="page-name-box">
      <h3>صفحة رسم جديدة</h3><p>اكتب اسماً واضحاً حتى تجدها أنت وصديقك بسهولة.</p>
      <input id="pageNameInput" maxlength="60" placeholder="مثلاً: رسمة اليوم">
      <div class="page-name-actions"><button class="cancel" id="pageNameCancel">إلغاء</button><button class="ok" id="pageNameOk">إنشاء الصفحة</button></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
</div>

/* ---------------- Utilities ---------------- */

function toast(msg, ms=2200){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), ms);

function uid8(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function nowTs(){ return Date.now(); }
function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now()-ts;
  const m = Math.floor(diff/60000);
  if(m<1) return 'الآن';
  if(m<60) return `منذ ${m} د`;
  const h = Math.floor(m/60);
  if(h<24) return `منذ ${h} س`;
  const d = Math.floor(h/24);
  return `منذ ${d} ي`;
}
const USER_COLORS = ['#d97a63','#7a9e7e','#6b8fb0','#c78fb0','#c9a24a','#9a7fc7'];
function colorForUid(id){
  let h=0; for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i))|0; }
  return USER_COLORS[Math.abs(h)%USER_COLORS.length];
}

/* ---------------- Local persistence (localStorage, mirrors this dev's usual pattern) ---------------- */
const LS_PREFIX = 'nrasm_';
const Local = {
  getPapersIndex(){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+'papers')||'{}'); }catch(e){ return {}; } },
  setPapersIndex(idx){ localStorage.setItem(LS_PREFIX+'papers', JSON.stringify(idx)); },
  getPaper(id){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+'paper_'+id)||'null'); }catch(e){ return null; } },
  setPaper(id,data){ localStorage.setItem(LS_PREFIX+'paper_'+id, JSON.stringify(data)); },
  getStrokes(id){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+'strokes_'+id)||'{}'); }catch(e){ return {}; } },
  setStrokes(id,strokes){
    try{ localStorage.setItem(LS_PREFIX+'strokes_'+id, JSON.stringify(strokes)); }
    catch(e){ /* storage full — drop silently, cloud copy still safe */ }
  },
  queuePush(id, op){
    const key = LS_PREFIX+'queue_'+id;
    const q = JSON.parse(localStorage.getItem(key)||'[]');
    q.push(op);
    localStorage.setItem(key, JSON.stringify(q));
  },
  queueGet(id){ return JSON.parse(localStorage.getItem(LS_PREFIX+'queue_'+id)||'[]'); },
  queueClear(id){ localStorage.removeItem(LS_PREFIX+'queue_'+id); },
  getName(){ return localStorage.getItem(LS_PREFIX+'name') || ''; },
  setName(n){ localStorage.setItem(LS_PREFIX+'name', n); },
  hasSeenPrank(){ return localStorage.getItem(LS_PREFIX+'prankSeen') === '1'; },
  setSeenPrank(){ localStorage.setItem(LS_PREFIX+'prankSeen','1'); }
};

function authenticateEmail(mode){
  const name=$('nameInput').value.trim(), email=$('emailInput').value.trim(), password=$('passwordInput').value;
  if(!name){authMessage('اكتب اسمك أولاً');return;}
  if(!email||!email.includes('@')){authMessage('اكتب إيميل صحيح');return;}
  if(password.length<6){authMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل');return;}
  authMessage(mode==='register'?'جاري إنشاء الحساب…':'جاري تسجيل الدخول…');
  let task;
  // Email accounts are intentionally independent from the old anonymous
  // session: no linkWithCredential, no migration, and no mixed identities.
  if(mode==='register'){
    task=auth.createUserWithEmailAndPassword(email,password);
  } else {
    task=auth.signInWithEmailAndPassword(email,password);
  }
  task.then(result=>{
    if(currentUser && currentUser.isAnonymous){
      // Do not mix the old anonymous library with the new email account.
      localStorage.removeItem(LS_PREFIX+'papers');
    }
    currentUser=result.user;
    Local.setName(name); userProfile={name,color:colorForUid(currentUser.uid)}; ensureUserProfile();
    $('namePrompt').style.display='none'; afterAuthReady();
  }).catch(err=>{
    console.error(err);
    const messages={'auth/email-already-in-use':'الإيميل مستخدم من قبل — اختر دخول','auth/invalid-credential':'الإيميل أو كلمة المرور غير صحيحة','auth/weak-password':'كلمة المرور ضعيفة','auth/invalid-email':'الإيميل غير صحيح'};

  });

function loadLibrary(){
  // Shared library: every authenticated friend sees the same papers.
  const papersRef = db.ref('papers');
  papersRef.off('value');
  papersRef.on('value', snap=>{
    const all = snap.val() || {};
    const idx = {};
    const ids = Object.keys(all).filter(id=> all[id] && all[id].meta).map(id=>{ idx[id]=true; return id; });
    // Do not overwrite a healthy local index with an empty/partial Firebase
    // response while the connection is still settling.
    if(ids.length) Local.setPapersIndex(idx);
    if(ids.length===0){
      const localIds=Object.keys(Local.getPapersIndex());
      if(localIds.length){ $('libEmpty').style.display='none'; $('library').classList.add('active'); renderLibraryCards(localIds); return; }
      $('libGrid').innerHTML=''; $('library').classList.remove('active'); $('libEmpty').style.display='flex'; return;
    }
    $('libEmpty').style.display='none'; $('library').classList.add('active');
    renderLibraryCards(ids, all);
  }, ()=>{
    const idx = Local.getPapersIndex(); const ids = Object.keys(idx);
    if(ids.length===0) $('libEmpty').style.display='flex'; else renderLibraryCards(ids);
  });
}

function renderLibraryCards(ids, sharedData){
  const grid = $('libGrid');

  const metaPromises = ids.map(id=>
    ((sharedData && sharedData[id] && sharedData[id].meta) || (Local.getPaper(id)||{}).meta
      ? Promise.resolve({id, meta:(sharedData && sharedData[id] && sharedData[id].meta) || (Local.getPaper(id)||{}).meta})
      : db.ref(`papers/${id}/meta`).once('value').then(s=>({id, meta:s.val()})))
      .catch(()=>({id, meta: (Local.getPaper(id)||{}).meta}))
  );
  Promise.all(metaPromises).then(results=>{
    results.sort((a,b)=> (b.meta?.updatedAt||0) - (a.meta?.updatedAt||0));
    results.forEach(({id,meta})=>{
      if(!meta) return;
      const card = document.createElement('div');
      card.className='paper-card'; card.dataset.paperId=id;
      const cached = Local.getPaper(id);
      const thumb = meta.thumb || (cached && cached.thumb) ? `<img src="${meta.thumb || cached.thumb}">` : `<div class="ph">✎</div>`;
      card.innerHTML = `
        <button class="paper-delete" title="حذف الصفحة" aria-label="حذف الصفحة">×</button>

/* =========================================================
   FIREBASE LISTENERS (strokes, activeStroke previews, presence)
========================================================= */
function attachPaperListeners(id){
  const strokesRef = db.ref(`papers/${id}/strokes`);
  const removedRef = strokesRef; // same node, use child_removed
  const activeRef = db.ref(`papers/${id}/activeStrokes`);
  const presenceRef = db.ref(`papers/${id}/presence`);

  strokesRef.on('child_added', snap=>{
    const s = snap.val(); if(!s) return;
    if(strokes[snap.key]) return;
    strokes[snap.key] = s;
    persistStrokesLocal();
    drawStroke(s);
  });
  strokesRef.on('child_removed', snap=>{
    delete strokes[snap.key];
    persistStrokesLocal();
    redrawAll();
  });
  activeRef.on('value', snap=>{
    renderLivePreviews(snap.val()||{});
  });
  presenceRef.on('value', snap=>{
    renderPresence(snap.val()||{});
  });

  firebaseRefs = {strokesRef, activeRef, presenceRef};
  listenersAttached = true;
}

function detachPaperListeners(){
  if(!listenersAttached) return;
  Object.values(firebaseRefs).forEach(r=> r && r.off());
  firebaseRefs = {};
  listenersAttached = false;
}

function persistStrokesLocal(){
  if(!currentPaperId) return;
  Local.setStrokes(currentPaperId, strokes);
  const p = Local.getPaper(currentPaperId) || {};
  p.meta = currentPaperMeta;
  Local.setPaper(currentPaperId, p);
}

/* =========================================================
   CANVAS ENGINE
========================================================= */
function stableNoise(seed){const x=Math.sin(seed*12.9898)*43758.5453;return x-Math.floor(x);}
function smoothPath(ctx,pts){
  ctx.beginPath(); if(!pts.length)return; ctx.moveTo(pts[0].x,pts[0].y);
  if(pts.length===1){ctx.lineTo(pts[0].x+.01,pts[0].y+.01);return;}
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);}
  const a=pts[pts.length-2],b=pts[pts.length-1];ctx.quadraticCurveTo(a.x,a.y,b.x,b.y);
}
function strokePath(ctx,pts,size){
  ctx.lineWidth=Math.max(1,size);ctx.lineCap='round';ctx.lineJoin='round';
  if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,Math.max(.5,size/2),0,Math.PI*2);ctx.fill();return;}
  smoothPath(ctx,pts);ctx.stroke();
}
function paintStroke(ctx,s){
  const pts=s.points||[];if(!pts.length)return;const alpha=Math.max(0,Math.min(1,(s.opacity??100)/100));
  ctx.save();ctx.globalCompositeOperation=s.brush==='eraser'?'destination-out':'source-over';ctx.globalAlpha=alpha;
  const pressure=(p)=>Math.max(.35,Math.min(1.5,(p?.p??.5)*1.35));
  if(s.brush==='eraser'){ctx.fillStyle='#000';ctx.strokeStyle='#000';strokePath(ctx,pts,s.size*1.25);ctx.restore();return;}
  ctx.strokeStyle=s.color||'#2b2622';ctx.fillStyle=s.color||'#2b2622';ctx.lineCap='round';ctx.lineJoin='round';
  if(s.brush==='pencil'){
    for(let i=1;i<pts.length;i++){ctx.globalAlpha=alpha*(.65+pressure(pts[i])*.22);ctx.lineWidth=Math.max(.6,s.size*.42*pressure(pts[i]));ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
  } else if(s.brush==='smooth'){
    ctx.globalAlpha=alpha;ctx.lineWidth=s.size*.62;strokePath(ctx,pts,ctx.lineWidth);
  } else if(s.brush==='ink'){
    for(let i=1;i<pts.length;i++){ctx.globalAlpha=alpha;ctx.lineWidth=Math.max(.8,s.size*.72*pressure(pts[i]));ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
  } else if(s.brush==='marker'){
    ctx.globalAlpha=alpha*.48;ctx.lineWidth=s.size*1.05;strokePath(ctx,pts,ctx.lineWidth);
  } else if(s.brush==='crayon'){
    for(let k=-1;k<=1;k++){ctx.globalAlpha=alpha*.25;ctx.lineWidth=Math.max(1,s.size*.28);ctx.beginPath();ctx.moveTo(pts[0].x+k*s.size*.16,pts[0].y-k*s.size*.12);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x+k*s.size*.16,pts[i].y-k*s.size*.12);ctx.stroke();}
  } else if(s.brush==='watercolor'){
    for(let k=0;k<4;k++){ctx.globalAlpha=alpha*.10;ctx.lineWidth=s.size*(.75+k*.22);strokePath(ctx,pts,ctx.lineWidth);}
  } else if(s.brush==='oil'){
    for(let k=0;k<4;k++){ctx.globalAlpha=alpha*.22;ctx.lineWidth=Math.max(1,s.size*.32);ctx.beginPath();for(let i=0;i<pts.length;i++){const off=(stableNoise((s.seed||1)+i*31+k*997)-.5)*s.size*.35;if(i===0)ctx.moveTo(pts[i].x+off,pts[i].y+off);else ctx.lineTo(pts[i].x+off,pts[i].y+off);}ctx.stroke();}
  } else if(s.brush==='airbrush'){
    for(let i=0;i<pts.length;i++){for(let k=0;k<12;k++){const a=stableNoise((s.seed||1)+i*73+k*911)*Math.PI*2,r=stableNoise((s.seed||1)+i*131+k*577)*s.size;ctx.globalAlpha=alpha*.035;ctx.beginPath();ctx.arc(pts[i].x+Math.cos(a)*r,pts[i].y+Math.sin(a)*r,Math.max(.7,s.size*.1),0,Math.PI*2);ctx.fill();}}
  } else if(s.brush==='glow'){
    ctx.globalAlpha=alpha*.9;ctx.shadowColor=s.color;ctx.shadowBlur=s.size*1.5;ctx.lineWidth=Math.max(1,s.size*.35);strokePath(ctx,pts,ctx.lineWidth);ctx.shadowBlur=0;
  } else if(s.brush==='soft'){
    ctx.globalAlpha=alpha*.52;ctx.filter=`blur(${Math.max(1,s.size*.18)}px)`;ctx.lineWidth=s.size*.75;strokePath(ctx,pts,ctx.lineWidth);ctx.filter='none';
  } else if(s.brush==='pixel'){
    const g=Math.max(3,s.size*.5);ctx.globalAlpha=alpha;pts.forEach(q=>{const x=Math.round(q.x/g)*g,y=Math.round(q.y/g)*g;ctx.fillRect(x-g/2,y-g/2,g,g);});
  } else {ctx.globalAlpha=alpha;ctx.lineWidth=s.size*.6;strokePath(ctx,pts,ctx.lineWidth);}
  ctx.restore();
}

let dCanvas, dCtx, lCanvas, lCtx;
let view = { x:0, y:0, scale:1 };
let currentStrokeId = null, currentPoints = [], drawing = false;
let lastActiveSend = 0, panMode = false, lastPan = null, spaceDown = false;
let pointers = new Map(), pinchState = null;
let liveFrame = 0;
function scheduleLiveRender(){
  if(liveFrame)return;
  liveFrame=requestAnimationFrame(()=>{liveFrame=0;renderLivePreviews({});});
}

function initCanvasIfNeeded(){
  if(dCanvas) return;
  dCanvas=$('drawCanvas'); dCtx=dCanvas.getContext('2d',{alpha:true});
  lCanvas=$('liveCanvas'); lCtx=lCanvas.getContext('2d',{alpha:true});
  dCanvas.addEventListener('pointerdown', onPointerDown, {passive:false});
  dCanvas.addEventListener('pointermove', onPointerMove, {passive:false});
  dCanvas.addEventListener('pointerup', onPointerUp, {passive:false});
  dCanvas.addEventListener('pointercancel', onPointerUp, {passive:false});
  dCanvas.addEventListener('wheel', onWheel, {passive:false});
  window.addEventListener('resize', ()=>{ resizeCanvases(); redrawAll(); renderLivePreviews({}); });
  window.addEventListener('keydown', onKeydown); window.addEventListener('keyup', e=>{if(e.code==='Space')spaceDown=false;});
  buildBrushGrid(); buildColorGrid(); bindToolbar();
}
function resizeCanvases(){
  const ratio=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  [dCanvas,lCanvas].forEach(c=>{c.width=Math.round(innerWidth*ratio);c.height=Math.round(innerHeight*ratio);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';});
  dCanvas._ratio=ratio; lCanvas._ratio=ratio;
  if(!dCanvas._didCenter){view.x=innerWidth/2;view.y=innerHeight/2;view.scale=1;dCanvas._didCenter=true;}
}
function worldToScreen(x,y){return{x:x*view.scale+view.x,y:y*view.scale+view.y};}
function screenToWorld(x,y){return{x:(x-view.x)/view.scale,y:(y-view.y)/view.scale};}
function applyTransform(ctx){const r=ctx.canvas._ratio||1;ctx.setTransform(r*view.scale,0,0,r*view.scale,r*view.x,r*view.y);}
function redrawAll(){
  if(!dCtx)return; dCtx.setTransform(1,0,0,1,0,0);dCtx.clearRect(0,0,dCanvas.width,dCanvas.height);applyTransform(dCtx);
  Object.values(strokes).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(s=>paintStroke(dCtx,s));
  $('zoomIndicator').textContent=Math.round(view.scale*100)+'%';
}
function drawStroke(s){redrawAll();}
function renderLivePreviews(activeMap){
  if(!lCtx)return; lCtx.setTransform(1,0,0,1,0,0);lCtx.clearRect(0,0,lCanvas.width,lCanvas.height);applyTransform(lCtx);
  // Keep the live layer for in-progress strokes only. Painting the finished
  // artwork here as well caused transparent strokes to be composited twice,
  // making intersections darker and making erased pixels reappear on release.
  if(drawing&&tool.brush==='eraser'&&currentPoints.length){
    redrawAll(); applyTransform(dCtx);
    paintStroke(dCtx,{brush:'eraser',size:tool.size,color:'#000',opacity:100,points:currentPoints});
    return;
  }
  Object.keys(activeMap||{}).forEach(uid=>{if(uid!==currentUser.uid&&activeMap[uid]?.points?.length)paintStroke(lCtx,activeMap[uid]);});
  if(drawing&&currentPoints.length)paintStroke(lCtx,{brush:tool.brush,color:tool.color,size:tool.size,opacity:tool.opacity,points:currentPoints,seed:0});
}
function smoothInputPoint(world){
  const last=currentPoints[currentPoints.length-1];
  if(!last)return world;
  const amount=Math.max(0,Math.min(.88,(tool.stabilization||0)/100*.88));
  return {x:last.x+(world.x-last.x)*(1-amount),y:last.y+(world.y-last.y)*(1-amount)};
}
function onPointerDown(e){
  e.preventDefault(); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ if(drawing){drawing=false;currentPoints=[];db.ref(`papers/${currentPaperId}/activeStrokes/${currentUser.uid}`).remove();} beginPinch(); return; }
  if(e.button===1||spaceDown){panMode=true;lastPan={x:e.clientX,y:e.clientY};dCanvas.setPointerCapture(e.pointerId);return;}
  drawing=true;currentStrokeId=uid8();currentPoints=[];addPoint(e);dCanvas.setPointerCapture(e.pointerId);renderLivePreviews({});
}
function beginPinch(){const a=[...pointers.values()];pinchState={distance:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),center:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},world:screenToWorld((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)};}
function onPointerMove(e){
  e.preventDefault(); if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){
    const a=[...pointers.values()], dist=Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;
    if(!pinchState)beginPinch(); const factor=dist/pinchState.distance;view.scale=Math.max(.1,Math.min(8,view.scale*factor));
    const after=worldToScreen(pinchState.world.x,pinchState.world.y);view.x+=cx-after.x;view.y+=cy-after.y;pinchState.distance=dist;pinchState.world=screenToWorld(cx,cy);redrawAll();renderLivePreviews({});return;
  }
  const world=screenToWorld(e.clientX,e.clientY);sendCursor(world.x,world.y);
  if(panMode&&lastPan){view.x+=e.clientX-lastPan.x;view.y+=e.clientY-lastPan.y;lastPan={x:e.clientX,y:e.clientY};redrawAll();renderLivePreviews({});return;}
  if(!drawing)return;addPoint(e);throttledBroadcastActive();scheduleLiveRender();
}
function onPointerUp(e){
  e.preventDefault();pointers.delete(e.pointerId);
  if(pointers.size<2)pinchState=null;
  if(panMode){panMode=false;lastPan=null;return;}
  if(!drawing)return;drawing=false;finalizeStroke();renderLivePreviews({});
}
function addPoint(e){
  const raw=screenToWorld(e.clientX,e.clientY), world=smoothInputPoint(raw), pressure=e.pressure>0?e.pressure:.5;
  const last=currentPoints[currentPoints.length-1]; if(last&&Math.hypot(world.x-last.x,world.y-last.y)<Math.max(.35,1.2/view.scale))return;
  currentPoints.push({x:world.x,y:world.y,p:pressure});
}
function throttledBroadcastActive(){
  if(!currentPaperId)return;const t=performance.now();if(t-lastActiveSend<35)return;lastActiveSend=t;
  db.ref(`papers/${currentPaperId}/activeStrokes/${currentUser.uid}`).set({brush:tool.brush,color:tool.color,size:tool.size,opacity:tool.opacity,points:currentPoints.slice(-60),seed:0}).catch(()=>{});
}
function finalizeStroke(){
  if(!currentPoints.length){currentPoints=[];return;}
  const stroke={userId:currentUser.uid,brush:tool.brush,color:tool.color,size:tool.size,opacity:tool.opacity,points:currentPoints,createdAt:nowTs(),seed:Math.floor(Math.random()*100000)};
  const sid=currentStrokeId;strokes[sid]=stroke;undoStack.push(sid);redoStack=[];persistStrokesLocal();redrawAll();currentPoints=[];currentStrokeId=null;
  if(currentPaperId)db.ref(`papers/${currentPaperId}/strokes/${sid}`).set(stroke).then(()=>db.ref(`papers/${currentPaperId}/activeStrokes/${currentUser.uid}`).remove()).then(()=>db.ref(`papers/${currentPaperId}/meta/updatedAt`).set(nowTs())).catch(()=>{Local.queuePush(currentPaperId,{type:'add_stroke',id:sid,stroke});if(!navigator.onLine)setOfflineBadge(true);});
  scheduleThumbUpdate();
}
function undo(){const sid=undoStack.pop();if(!sid)return;const s=strokes[sid];redoStack.push({id:sid,stroke:s});delete strokes[sid];persistStrokesLocal();redrawAll();renderLivePreviews({});if(currentPaperId)db.ref(`papers/${currentPaperId}/strokes/${sid}`).remove().catch(()=>Local.queuePush(currentPaperId,{type:'remove_stroke',id:sid}));}
function redo(){const item=redoStack.pop();if(!item)return;strokes[item.id]=item.stroke;undoStack.push(item.id);persistStrokesLocal();redrawAll();renderLivePreviews({});if(currentPaperId)db.ref(`papers/${currentPaperId}/strokes/${item.id}`).set(item.stroke);}
function onWheel(e){e.preventDefault();const before=screenToWorld(e.clientX,e.clientY);view.scale=Math.max(.1,Math.min(8,view.scale*(e.deltaY<0?1.1:.9090909)));const after=worldToScreen(before.x,before.y);view.x+=e.clientX-after.x;view.y+=e.clientY-after.y;redrawAll();renderLivePreviews({});}
function zoomAt(cx,cy,factor){const before=screenToWorld(cx,cy);view.scale=Math.max(.1,Math.min(8,view.scale*factor));const after=worldToScreen(before.x,before.y);view.x+=cx-after.x;view.y+=cy-after.y;redrawAll();renderLivePreviews({});}
function onKeydown(e){if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==='z'&&e.shiftKey){e.preventDefault();redo();return;}if(e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}}if(e.code==='Space'){spaceDown=true;e.preventDefault();}if(e.key==='e')selectBrush('eraser');if(e.key==='b')selectBrush('pencil');}

/* =========================================================
   TOOLBAR / PANELS
========================================================= */
const BRUSHES = [
  {id:'pencil', icon:'✏️', label:'قلم رصاص'},
  {id:'smooth', icon:'🖊️', label:'قلم ناعم'},
  {id:'ink', icon:'🖋️', label:'حبر'},
  {id:'marker', icon:'🖍️', label:'ماركر'},
  {id:'crayon', icon:'🎨', label:'كرايون'},
  {id:'watercolor', icon:'💧', label:'ألوان مائية'},
  {id:'oil', icon:'🧴', label:'زيتي'},
  {id:'airbrush', icon:'✨', label:'إيربرش'},
  {id:'glow', icon:'💫', label:'توهج'},
  {id:'soft', icon:'☁️', label:'ناعم'},
  {id:'pixel', icon:'🔲', label:'بكسل'},
  {id:'eraser', icon:'🧹', label:'ممحاة'},
];
const PRESET_COLORS = ['#2b2622','#ffffff','#d97a63','#c94f3c','#e0a13e','#6b8fb0','#4c6b8a','#7a9e7e','#3f6e52','#c78fb0','#8b5fa3','#5c554d'];

function buildBrushGrid(){
  const g = $('brushGrid');
  g.innerHTML='';
  BRUSHES.forEach(b=>{
    const el = document.createElement('div');
    el.className='brush-opt'+(b.id===tool.brush?' active':'');
    el.innerHTML = `<span class="bi">${b.icon}</span>${b.label}`;
    el.addEventListener('click', ()=> selectBrush(b.id));
    el.dataset.id = b.id;
    g.appendChild(el);
  });
}
function selectBrush(id){
  tool.brush = id;
  $('eraserQuick')?.classList.toggle('tool-active', id==='eraser');
  document.querySelectorAll('.brush-opt').forEach(e=> e.classList.toggle('active', e.dataset.id===id));
}
function buildColorGrid(){
  const g = $('colorGrid');
  g.innerHTML='';
  PRESET_COLORS.forEach(c=>{
    const d = document.createElement('div');
    d.className='color-dot'+(c===tool.color?' active':'');
    d.style.background=c;
    d.addEventListener('click', ()=> setColor(c));
    d.dataset.c=c;
    g.appendChild(d);
  });
}
function setColor(c){
  tool.color = c;
  $('colorPreview').style.background = c;
  $('colorNative').value = c;
  $('hexInput').value = c;
  document.querySelectorAll('.color-dot').forEach(d=> d.classList.toggle('active', d.dataset.c===c));
  if(!tool.recentColors.includes(c)){
    tool.recentColors.unshift(c);
    tool.recentColors = tool.recentColors.slice(0,6);
  }
}

function bindToolbar(){
  $('brushToggle').addEventListener('click', ()=> togglePanel('brushPanel'));
  $('eraserQuick').addEventListener('click', ()=>{selectBrush('eraser'); $('eraserQuick').classList.add('tool-active'); toast('الممحاة مفعلة — تمسح أثناء السحب');});
  $('colorToggle').addEventListener('click', ()=> togglePanel('colorPanel'));
  $('sizeToggle').addEventListener('click', ()=> togglePanel('sizePanel'));
  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);
  $('zoomInBtn').addEventListener('click', ()=>{ zoomAt(innerWidth/2, innerHeight/2, 1.2); redrawAll(); });
  $('zoomOutBtn').addEventListener('click', ()=>{ zoomAt(innerWidth/2, innerHeight/2, 0.83); redrawAll(); });
  $('zoomResetBtn').addEventListener('click', ()=>{ view.scale=1; view.x=innerWidth/2; view.y=innerHeight/2; redrawAll(); });
  $('sizeRange').addEventListener('input', e=>{ tool.size = +e.target.value; });
  $('opacityRange').addEventListener('input', e=>{ tool.opacity = +e.target.value; });
  $('stabilizeRange').addEventListener('input', e=>{ tool.stabilization = +e.target.value; });
  $('colorNative').addEventListener('input', e=> setColor(e.target.value));
  $('hexInput').addEventListener('change', e=>{
    let v = e.target.value.trim();
    if(!v.startsWith('#')) v='#'+v;
    if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)) setColor(v);
  });
  $('downloadBtn').addEventListener('click', exportPNG);
  document.addEventListener('click', e=>{
    if(!e.target.closest('.panel') && !e.target.closest('#brushToggle') && !e.target.closest('#colorToggle') && !e.target.closest('#sizeToggle')){
      closeAllPanels();
    }
  });
}
function togglePanel(id){
  const wasActive = $(id).classList.contains('active');
  closeAllPanels();
  if(!wasActive) $(id).classList.add('active');
}
function closeAllPanels(){
  ['brushPanel','colorPanel','sizePanel'].forEach(id=> $(id).classList.remove('active'));
}

/* =========================================================
   PNG EXPORT (artwork only, high resolution)
========================================================= */
function exportPNG(){
  const list = Object.values(strokes);
  if(list.length===0){ toast('لا يوجد رسم بعد'); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  list.forEach(s=> (s.points||[]).forEach(p=>{
    minX=Math.min(minX,p.x-((s.size||10))); minY=Math.min(minY,p.y-((s.size||10)));
    maxX=Math.max(maxX,p.x+((s.size||10))); maxY=Math.max(maxY,p.y+((s.size||10)));
  }));
  const pad = 40;
  minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  const w = Math.max(200, maxX-minX), h = Math.max(200, maxY-minY);
  const scaleFactor = Math.min(4, 2400/Math.max(w,h)) ;
  const off = document.createElement('canvas');
  off.width = w*scaleFactor; off.height = h*scaleFactor;
  const octx = off.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0,0,off.width,off.height);
  octx.setTransform(scaleFactor,0,0,scaleFactor,-minX*scaleFactor,-minY*scaleFactor);
  list.sort((a,b)=>a.createdAt-b.createdAt).forEach(s=> paintStroke(octx, s));
  off.toBlob(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (currentPaperMeta?.name || 'رسمة') + '.png';
    a.click();
  }, 'image/png');
}

/* thumb generation, throttled */
let thumbTimer=null;
function scheduleThumbUpdate(){
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(generateThumb, 1200);
}
function generateThumb(){
  if(!currentPaperId) return;
  const off = document.createElement('canvas');
  off.width=240; off.height=180;
  const octx = off.getContext('2d');
  octx.fillStyle='#fbfaf7'; octx.fillRect(0,0,240,180);
  const list = Object.values(strokes);
  if(list.length){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    list.forEach(s=> (s.points||[]).forEach(p=>{
      minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
    }));
    const w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
    const s = Math.min(220/w, 160/h, 3);
    octx.setTransform(s,0,0,s, 120-( (minX+maxX)/2 )*s, 90-((minY+maxY)/2)*s );
    list.sort((a,b)=>a.createdAt-b.createdAt).forEach(st=> paintStroke(octx, st));
  }
  const dataUrl = off.toDataURL('image/jpeg', 0.6);
  const p = Local.getPaper(currentPaperId) || {};
  p.thumb = dataUrl; p.meta = currentPaperMeta;
  Local.setPaper(currentPaperId, p);
  if(currentPaperMeta){
    currentPaperMeta.thumb = dataUrl;
    db.ref(`papers/${currentPaperId}/meta/thumb`).set(dataUrl).catch(()=>{});
  }
}

/* =========================================================
   OFFLINE / SYNC
========================================================= */
function setOfflineBadge(show){
  $('offlineBadge').classList.toggle('show', show);
}
window.addEventListener('online', ()=>{ isOnline=true; setOfflineBadge(false); flushQueue(); toast('رجع النت — نتزامن ❤️'); });
window.addEventListener('offline', ()=>{ isOnline=false; setOfflineBadge(true); });

function flushQueue(){
  if(!currentPaperId) return;
  const q = Local.queueGet(currentPaperId);
  if(!q.length) return;
  const proms = q.map(op=>{
    if(op.type==='add_stroke') return db.ref(`papers/${currentPaperId}/strokes/${op.id}`).set(op.stroke);
    if(op.type==='remove_stroke') return db.ref(`papers/${currentPaperId}/strokes/${op.id}`).remove();
    if(op.type==='create_meta') return db.ref(`papers/${currentPaperId}/meta`).set(op.meta);
    return Promise.resolve();
  });
  Promise.all(proms).then(()=> Local.queueClear(currentPaperId)).catch(()=>{});
}

boot();
})();
</script>
